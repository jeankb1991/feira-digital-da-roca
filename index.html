<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Feira Digital da Roça — Produtos frescos da agricultura familiar, direto do produtor para você[cite: 4].">
  <meta name="theme-color" content="#2D6A4F">
  <title>Feira Digital da Roça</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Crítico Inicial -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#F4FAF6;color:#1A2E24;overflow-x:hidden}
    .hidden{display:none!important}
    .loading-screen{
      position:fixed;inset:0;
      background:linear-gradient(135deg,#1B4332 0%,#2D6A4F 60%,#52B788 100%);
      display:flex;align-items:center;justify-content:center;z-index:9999;
      transition:opacity .6s ease,visibility .6s ease
    }
    .loading-screen.fade-out{opacity:0;visibility:hidden}
    .loading-inner{text-align:center;color:white}
    .spinner{
      width:40px;height:40px;border:3px solid rgba(255,255,255,.3);
      border-top-color:white;border-radius:50%;margin:0 auto;animation:spin .9s linear infinite
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    #app{min-height:100vh;padding-top:68px}
  </style>

  <!-- Estilos Externos -->
  <link rel="stylesheet" href="style.css"> <!--[cite: 4] -->
</head>
<body>

  <!-- Tela de Carregamento -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-inner">
      <div style="font-size:2.5rem;margin-bottom:16px;">🌿</div>
      <div class="spinner"></div>
      <p style="margin-top:16px;font-size:.9rem;opacity:.8;">Carregando plataforma...</p>
    </div>
  </div>

  <!-- Contêiner de Notificações Toast -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Barra de Navegação -->
  <nav class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="#" class="navbar-brand">
        <span class="brand-icon">🌾</span>
        <span class="brand-name">Feira Digital da Roça</span>
      </div>
      <div class="nav-links" id="nav-links">
        <a href="#catalog" class="nav-link">Catálogo</a>
        <a href="#producers" class="nav-link">Produtores</a>
      </div>
      <div class="nav-auth">
        <div id="guest-buttons" class="guest-buttons">
          <a href="#login" class="btn btn-ghost btn-sm">Entrar</a>
          <a href="#register" class="btn btn-primary btn-sm">Cadastrar</a>
        </div>
        <div id="user-area" class="user-area hidden">
          <button class="user-avatar-btn" id="user-avatar-btn">
            <span class="avatar-initials" id="avatar-initials">?</span>
          </button>
          <div class="user-dropdown" id="user-dropdown">
            <div class="dropdown-header">
              <span class="dropdown-name" id="dropdown-name">Usuário</span>
              <span class="dropdown-role" id="dropdown-role">Produtor</span>
            </div>
            <div class="dropdown-divider"></div>
            <a href="#dashboard" class="dropdown-item">📊 Meu Painel</a>
            <a href="#profile-edit" class="dropdown-item">✏️ Meu Perfil</a>
            <a href="#admin" class="dropdown-item hidden" id="link-admin">🛡️ Administração</a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item item-danger" id="btn-logout">🚪 Sair</button>
          </div>
        </div>
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <div class="mobile-menu hidden" id="mobile-menu">
      <a href="#catalog" class="mobile-nav-link">🛒 Catálogo</a>
      <a href="#producers" class="mobile-nav-link">👨‍🌾 Produtores</a>
      <div class="mobile-divider"></div>
      <div id="mobile-guest" class="mobile-auth">
        <a href="#login" class="btn btn-ghost btn-block">Entrar</a>
        <a href="#register" class="btn btn-primary btn-block">Cadastrar-se</a>
      </div>
      <div id="mobile-user" class="mobile-auth hidden">
        <a href="#dashboard" class="btn btn-ghost btn-block">Meu Painel</a>
        <a href="#profile-edit" class="btn btn-ghost btn-block">Meu Perfil</a>
        <a href="#admin" class="btn btn-ghost btn-block hidden" id="mobile-admin-link">🛡️ Admin</a>
        <button class="btn btn-outline-danger btn-block" id="mobile-logout">Sair</button>
      </div>
    </div>
  </nav>

  <!-- Conteúdo Principal Dinâmico (SPA) -->
  <main id="app"></main>

  <!-- Modal Genérico -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box" id="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Modal</h3>
        <button class="modal-close-btn" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Scripts Externos e Lógica -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <!--[cite: 4] -->
  <script src="config.js"></script> <!--[cite: 4] -->
  <script src="app.js"></script> <!--[cite: 4] -->
</body>
</html>
